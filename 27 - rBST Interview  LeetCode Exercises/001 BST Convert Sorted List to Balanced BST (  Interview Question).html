    <script>
      const quizData = {"title": "001 BST Convert Sorted List to Balanced BST (  Interview Question)", "hasInstructions": true, "hasTests": true, "hasSolutions": true, "instructions": "<p><strong>Objective:</strong></p><p>The task is to develop a method that takes a sorted list of integers as input and constructs a height-balanced BST. <br><br>This involves creating a BST where the depth of the two subtrees of any node does not differ by more than one. <br><br>Achieving a height-balanced tree is crucial for optimizing the efficiency of tree operations, ensuring that the BST remains efficient for search, insertion, and deletion across all levels of the tree.</p><p><br></p><p><strong>Method Overview:</strong> <code><strong>__sorted_list_to_bst</strong></code></p><ul><li><p><strong>Input:</strong> A sorted list of integers <code><strong>nums</strong></code>, provided in ascending order. The input list represents a sequential collection of elements to be transformed into a BST. The method also receives two additional parameters, <code><strong>left</strong></code> and <code><strong>right</strong></code>, which denotes the current segment of the list being processed.</p></li><li><p><strong>Process:</strong> The method <code><strong>__sorted_list_to_bst</strong></code> employs a divide-and-conquer strategy to construct the BST. It identifies the middle element of the current list segment to serve as the subtree's root, ensuring that the resulting BST is height-balanced. The method recursively applies this logic to the left and right halves of the list, building up the BST from the bottom up.</p></li><li><p><strong>Output:</strong> The root node of a height-balanced BST constructed from the sorted list. This node links to all other nodes in the BST, effectively representing the entire tree structure.</p></li></ul><p><br></p><p><strong>Requirements:</strong></p><ul><li><p>The BST must maintain the binary search tree property: for any given node, all values in the left subtree must be less than the node's value, and all values in the right subtree must be greater.</p></li><li><p>The resulting BST should be height-balanced to optimize the efficiency of subsequent operations performed on the tree.</p></li></ul><p><br></p><p><strong>Implementation Details:</strong></p><ul><li><p>The class <code><strong>BinarySearchTree</strong></code> encapsulates the functionality needed to construct and manage a BST, including the method <code><strong>sorted_list_to_bst</strong></code> which serves as the public interface for converting a sorted list into a BST.</p></li><li><p>The method <code><strong>__sorted_list_to_bst</strong></code> is a recursive helper function designed for internal use within the class. It directly supports the construction process by dividing the list and building the tree to ensure it is height-balanced.</p></li></ul><p><br></p><p>If you are having difficulty understanding the process of repeatedly breaking the list in half recursively, it might be helpful to you to watch the Merge Sort section and then come back to this exercise.</p><p><br></p><p><br></p><img src=\"https://img-c.udemycdn.com/redactor/raw/coding_exercise_instructions/2024-02-06_18-44-21-aa0d278f463efddf113615300cf3e25d.png\"><p><br></p><p><br></p>", "tests": [{"file_name": "evaluate.py", "content": "from unittest import TestCase\n\nclass TestBinarySearchTree(TestCase):\n    def create_bst_from_sorted_list(self, nums):\n        import exercise\n        bst = exercise.BinarySearchTree()  \n        bst.sorted_list_to_bst(nums)\n        return bst\n\n    def test_empty_list(self):\n        bst = self.create_bst_from_sorted_list([])\n        self.assertIsNone(bst.root)\n        self.assertTrue(bst.is_balanced())\n\n    def test_single_element(self):\n        bst = self.create_bst_from_sorted_list([10])\n        self.assertIsNotNone(bst.root)\n        self.assertEqual(bst.root.value, 10)\n        self.assertIsNone(bst.root.left)\n        self.assertIsNone(bst.root.right)\n        self.assertTrue(bst.is_balanced())\n\n    def test_small_odd_number_of_elements(self):\n        bst = self.create_bst_from_sorted_list([1, 2, 3])\n        self.assertTrue(bst.is_balanced())\n        traversal_result = list(bst.inorder_traversal())\n        self.assertEqual(traversal_result, [1, 2, 3])\n\n    def test_small_even_number_of_elements(self):\n        bst = self.create_bst_from_sorted_list([1, 2, 3, 4])\n        self.assertTrue(bst.is_balanced())\n        traversal_result = list(bst.inorder_traversal())\n        self.assertEqual(traversal_result, [1, 2, 3, 4])\n\n    def test_large_even_number_of_elements(self):\n        bst = self.create_bst_from_sorted_list([1, 2, 3, 4, 5, 6])\n        self.assertTrue(bst.is_balanced())\n        traversal_result = list(bst.inorder_traversal())\n        self.assertEqual(traversal_result, [1, 2, 3, 4, 5, 6])\n\n    def test_large_odd_number_of_elements(self):\n        bst = self.create_bst_from_sorted_list([1, 2, 3, 4, 5, 6, 7])\n        self.assertTrue(bst.is_balanced())\n        traversal_result = list(bst.inorder_traversal())\n        self.assertEqual(traversal_result, [1, 2, 3, 4, 5, 6, 7])\n\n    def test_inorder_traversal_matches_sorted_list(self):\n        sorted_list = [1, 2, 3, 4, 5, 6, 7]\n        bst = self.create_bst_from_sorted_list(sorted_list)\n        traversal_result = list(bst.inorder_traversal())\n        self.assertEqual(traversal_result, sorted_list)\n\n\n"}], "solutions": [{"file_name": "exercise.py", "content": "class Node:\n    def __init__(self, value):\n        self.value = value\n        self.left = None\n        self.right = None\n\nclass BinarySearchTree:\n    def __init__(self):\n        self.root = None\n    \n    # The 'is_balanced' and 'inorder_traversal' methods will \n    # be used to test your code\n    def is_balanced(self, node=None):\n        def check_balance(node):\n            if node is None:\n                return True, -1\n            left_balanced, left_height = check_balance(node.left)\n            if not left_balanced:\n                return False, 0\n            right_balanced, right_height = check_balance(node.right)\n            if not right_balanced:\n                return False, 0\n            balanced = abs(left_height - right_height) <= 1\n            height = 1 + max(left_height, right_height)\n            return balanced, height\n\n        balanced, _ = check_balance(self.root if node is None else node)\n        return balanced\n        \n    def inorder_traversal(self, node=None):\n        if node is None:\n            node = self.root\n        result = []\n        self._inorder_helper(node, result)\n        return result\n    \n    def _inorder_helper(self, node, result):\n        if node:\n            self._inorder_helper(node.left, result)\n            result.append(node.value)\n            self._inorder_helper(node.right, result)\n                \n                \n    def sorted_list_to_bst(self, nums):\n        self.root = self.__sorted_list_to_bst(nums, 0, len(nums) - 1)\n\n    def __sorted_list_to_bst(self, nums, left, right):\n        if left > right:\n            return None\n            \n        mid = (left + right) // 2\n        current = Node(nums[mid])\n        \n        current.left = self.__sorted_list_to_bst(nums, left, mid - 1)\n        current.right = self.__sorted_list_to_bst(nums, mid + 1, right)\n        \n        return current\n\n\n\n\n# ==================================================================\ndef check_balanced_and_correct_traversal(bst, expected_traversal):\n    is_balanced = bst.is_balanced()\n    inorder = bst.inorder_traversal()\n    print(\"Is balanced:\", is_balanced)\n    print(\"Inorder traversal:\", inorder)\n    print(\"Expected traversal:\", expected_traversal)\n    if is_balanced and inorder == expected_traversal:\n        print(\"PASS: Tree is balanced and inorder traversal is correct.\\n\")\n    else:\n        print(\"FAIL: Tree is either not balanced or inorder traversal is incorrect.\\n\")\n\n# Test: Convert an empty list\nprint(\"\\n----- Test: Convert Empty List -----\\n\")\nbst = BinarySearchTree()\nbst.sorted_list_to_bst([])\ncheck_balanced_and_correct_traversal(bst, [])\n\n# Test: Convert a list with one element\nprint(\"\\n----- Test: Convert Single Element List -----\\n\")\nbst = BinarySearchTree()\nbst.sorted_list_to_bst([10])\ncheck_balanced_and_correct_traversal(bst, [10])\n\n# Test: Convert a sorted list with odd number of elements\nprint(\"\\n----- Test: Convert Sorted List with Odd Number of Elements -----\\n\")\nbst = BinarySearchTree()\nbst.sorted_list_to_bst([1, 2, 3, 4, 5])\ncheck_balanced_and_correct_traversal(bst, [1, 2, 3, 4, 5])\n\n# Test: Convert a sorted list with even number of elements\nprint(\"\\n----- Test: Convert Sorted List with Even Number of Elements -----\\n\")\nbst = BinarySearchTree()\nbst.sorted_list_to_bst([1, 2, 3, 4, 5, 6])\ncheck_balanced_and_correct_traversal(bst, [1, 2, 3, 4, 5, 6])\n\n# Test: Convert a large sorted list\nprint(\"\\n----- Test: Convert Large Sorted List -----\\n\")\nbst = BinarySearchTree()\nlarge_sorted_list = list(range(1, 16))  # A list from 1 to 15\nbst.sorted_list_to_bst(large_sorted_list)\ncheck_balanced_and_correct_traversal(bst, large_sorted_list)\n"}]};

      function renderCodeList(rootElement, codeList, className, titlePrefix) {
        for (var i = 0; i < codeList.length; i++) {
          var elem = codeList[i];
          var jsElem = document.createElement("div");
          jsElem.className = className;
          var jsElemTitle = document.createElement("h3");
          jsElemTitle.innerHTML = titlePrefix + " " + (i + 1);
          var jsElemBody = document.createElement("code");
          jsElemBody.className = "code-block black-block";
          jsElemBody.innerHTML = "<pre>" + elem.content + "</pre>";
          jsElem.appendChild(jsElemTitle);
          jsElem.appendChild(jsElemBody);
          rootElement.appendChild(jsElem);
        }
      }
      
      function main() {
        // display the assignment
        var codingTitle = document.getElementById("coding-title");
        codingTitle.innerHTML = quizData.title;
        
        var codingInstructions = document.getElementById("coding-instructions");
        if (quizData.hasInstructions) {
          codingInstructions.innerHTML = quizData.instructions;
        } else {
          codingInstructions.innerHTML = "<span class=\"italic-text\">" + quizData.instructions
            + "</span>";
        }

        // display the test(s)
        var codingTests = document.getElementById("coding-tests");
        if (!quizData.hasTests) {
          codingTests.innerHTML = "<span class=\"italic-text\">" + quizData.tests + "</span>";
        } else {
          renderCodeList(codingTests, quizData.tests, "coding-test", "Test");
        }
        

        // display the solution(s)
        var codingSolutions = document.getElementById("coding-solutions");
        if (!quizData.hasSolutions) {
          codingSolutions.innerHTML = "<span class=\"italic-text\">" + quizData.solutions + "</span>";
        } else {
          renderCodeList(codingSolutions, quizData.solutions, "coding-solution", "Solution");
        }
      }
    </script>
