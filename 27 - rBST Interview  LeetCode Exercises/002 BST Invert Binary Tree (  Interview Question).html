  <body onload="main()">
    <h1 id="coding-title"></h1>

    <script>
      const quizData = {"title": "002 BST Invert Binary Tree (  Interview Question)", "hasInstructions": true, "hasTests": true, "hasSolutions": true, "instructions": "<p><strong>Objective:</strong> Write a method to invert (or mirror) a binary tree. This means that for every node in the binary tree, you will swap its left and right children.</p><p><br></p><p><strong>Method Signature:</strong></p><p><code><strong>def __invert_tree(self, node):</strong></code></p><p><br></p><p><strong>Input:</strong></p><ul><li><p><code><strong>node</strong></code>: A <code><strong>Node</strong></code> object representing the root of a binary tree. The <code><strong>Node</strong></code> class has attributes <code><strong>value</strong></code>, <code><strong>left</strong></code>, and <code><strong>right</strong></code>, where <code><strong>value</strong></code> is the value stored in the node, and <code><strong>left</strong></code> and <code><strong>right</strong></code> are pointers to the node's left and right children, respectively.</p></li></ul><p><br></p><p><strong>Output:</strong></p><ul><li><p>The root node of the inverted binary tree.</p></li></ul><p><br></p><p><strong>Requirements:</strong></p><ol><li><p>The method must be recursive. It should work by traversing the tree and swapping the left and right children of every node encountered.</p></li><li><p>If the input tree is empty (i.e., <code><strong>node</strong></code> is <code><strong>None</strong></code>), the method should return <code><strong>None</strong></code>.</p></li><li><p>The inversion should happen in-place, meaning you should not create a new tree but instead modify the existing tree structure.</p></li><li><p>The method should handle binary trees of any size and structure, ensuring that every node's left and right children are swapped.</p></li></ol><p><br></p><p><strong>Example:</strong></p><p>Given a binary tree structured as follows:</p><p><br></p><p><img src=\"https://img-c.udemycdn.com/redactor/raw/coding_exercise_instructions/2024-02-07_18-12-05-6b3779ba262156f9ddf0a40c7d7fa588.png\"></p><p><br></p><p>After calling <code><strong>__invert_tree(root)</strong></code>, where <code><strong>root</strong></code> is the node with the value <code><strong>47</strong></code>, the tree should be inverted to look like this:</p><p><br></p><p><img src=\"https://img-c.udemycdn.com/redactor/raw/coding_exercise_instructions/2024-02-07_18-12-06-7d63f1b4e6b659e12e95f36fb3907944.png\"></p><p><br></p><p><br></p><p><strong>Note:</strong> This problem requires understanding binary trees, recursion, and the ability to manipulate tree nodes directly. The solution should ensure that every node's left and right children are swapped all the way down the tree, effectively creating a mirror image of the original structure.</p><p><br></p><p><br></p><p><img src=\"https://img-c.udemycdn.com/redactor/raw/coding_exercise_instructions/2024-02-07_18-12-06-b71ef9bc1f23b75fc560fc52b8300d93.png\"></p><p><br></p><p><br></p><p><br></p><p><br></p><p><br></p>", "tests": [{"file_name": "evaluate.py", "content": "import unittest\n\ndef tree_to_list(node):\n    \"\"\"Helper function to convert tree to list level-wise for easy comparison\"\"\"\n    if not node:\n        return []\n    queue = [node]\n    result = []\n    while queue:\n        current = queue.pop(0)\n        if current:\n            result.append(current.value)\n            queue.append(current.left)\n            queue.append(current.right)\n        else:\n            result.append(None)\n    # Remove trailing None values for comparison\n    while result and result[-1] is None:\n        result.pop()\n    return result\n\nclass TestInvertBinarySearchTree(unittest.TestCase):\n    def test_invert_empty_tree(self):\n        import exercise\n        bst = exercise.BinarySearchTree()\n        bst.invert()\n        self.assertIsNone(bst.root)\n\n    def test_invert_single_node(self):\n        import exercise\n        bst = exercise.BinarySearchTree()\n        bst.r_insert(1)\n        bst.invert()\n        self.assertEqual(tree_to_list(bst.root), [1])\n\n    def test_invert_tree_with_left_child(self):\n        import exercise\n        bst = exercise.BinarySearchTree()\n        bst.r_insert(2)\n        bst.r_insert(1)\n        bst.invert()\n        self.assertEqual(tree_to_list(bst.root), [2, None, 1])\n\n    def test_invert_tree_with_right_child(self):\n        import exercise\n        bst = exercise.BinarySearchTree()\n        bst.r_insert(1)\n        bst.r_insert(2)\n        bst.invert()\n        self.assertEqual(tree_to_list(bst.root), [1, 2])\n\n    def test_invert_multi_level_tree(self):\n        import exercise\n        bst = exercise.BinarySearchTree()\n        bst.r_insert(3)\n        bst.r_insert(1)\n        bst.r_insert(2)\n        bst.r_insert(5)\n        bst.invert()\n        self.assertEqual(tree_to_list(bst.root), [3, 5, 1, None, None, 2])\n\n\n    def test_invert_twice(self):\n        import exercise\n        bst = exercise.BinarySearchTree()\n        bst.r_insert(4)\n        bst.r_insert(2)\n        bst.r_insert(6)\n        bst.r_insert(1)\n        bst.r_insert(3)\n        bst.r_insert(5)\n        bst.r_insert(7)\n        bst.invert()\n        bst.invert()  # Inverting again should give the original tree\n        self.assertEqual(tree_to_list(bst.root), [4, 2, 6, 1, 3, 5, 7])\n\n\n"}], "solutions": [{"file_name": "exercise.py", "content": "class Node:\n    def __init__(self, value):\n        self.value = value\n        self.left = None\n        self.right = None\n        \nclass BinarySearchTree:\n    def __init__(self):\n        self.root = None\n                  \n    def __r_insert(self, current_node, value):\n        if current_node == None: \n            return Node(value)   \n        if value < current_node.value:\n            current_node.left = self.__r_insert(current_node.left, value)\n        elif value > current_node.value:  # Changed to elif to avoid comparing twice if equal\n            current_node.right = self.__r_insert(current_node.right, value) \n        return current_node    \n\n    def r_insert(self, value):\n        if self.root == None: \n            self.root = Node(value)\n        else:\n            self.__r_insert(self.root, value)  \n\n    def invert(self):\n        self.root = self.__invert_tree(self.root)\n\n    def __invert_tree(self, node):\n        if node is None:\n            return None\n    \n        temp = node.left\n        node.left = self.__invert_tree(node.right)\n        node.right = self.__invert_tree(temp)\n        \n        return node\n\n\n\n\n\ndef tree_to_list(node):\n    \"\"\"Helper function to convert tree to list level-wise for easy comparison\"\"\"\n    if not node:\n        return []\n    queue = [node]\n    result = []\n    while queue:\n        current = queue.pop(0)\n        if current:\n            result.append(current.value)\n            queue.append(current.left)\n            queue.append(current.right)\n        else:\n            result.append(None)\n    while result and result[-1] is None:  # Clean up trailing None values\n        result.pop()\n    return result\n\ndef test_invert_binary_search_tree():\n    print(\"\\n--- Testing Inversion of Binary Search Tree ---\")\n    # Define test scenarios\n    scenarios = [\n        (\"Empty Tree\", [], []),\n        (\"Single Node\", [1], [1]),\n        (\"Tree with Left Child\", [2, 1], [2, None, 1]),\n        (\"Tree with Right Child\", [1, 2], [1, 2]),\n        (\"Multi-Level Tree\", [3, 1, 5, 2], [3, 5, 1, None, None, 2]),\n        (\"Invert Twice\", [4, 2, 6, 1, 3, 5, 7], [4, 2, 6, 1, 3, 5, 7]),\n    ]\n\n    for description, setup, expected in scenarios:\n        bst = BinarySearchTree()\n        for num in setup:\n            bst.r_insert(num)\n        if description == \"Invert Twice\":\n            bst.invert()  # First inversion\n        bst.invert()  # Perform inversion (or second inversion for the specific case)\n        result = tree_to_list(bst.root)\n        print(f\"\\n{description}: {'Pass' if result == expected else 'Fail'}\")\n        print(f\"Expected: {expected}\")\n        print(f\"Actual:   {result}\")\n\ntest_invert_binary_search_tree()"}]};

      function renderCodeList(rootElement, codeList, className, titlePrefix) {
        for (var i = 0; i < codeList.length; i++) {
          var elem = codeList[i];
          var jsElem = document.createElement("div");
          jsElem.className = className;
          var jsElemTitle = document.createElement("h3");
          jsElemTitle.innerHTML = titlePrefix + " " + (i + 1);
          var jsElemBody = document.createElement("code");
          jsElemBody.className = "code-block black-block";
          jsElemBody.innerHTML = "<pre>" + elem.content + "</pre>";
          jsElem.appendChild(jsElemTitle);
          jsElem.appendChild(jsElemBody);
          rootElement.appendChild(jsElem);
        }
      }
      
      function main() {
        // display the assignment
        var codingTitle = document.getElementById("coding-title");
        codingTitle.innerHTML = quizData.title;
        
        var codingInstructions = document.getElementById("coding-instructions");
        if (quizData.hasInstructions) {
          codingInstructions.innerHTML = quizData.instructions;
        } else {
          codingInstructions.innerHTML = "<span class=\"italic-text\">" + quizData.instructions
            + "</span>";
        }

        // display the test(s)
        var codingTests = document.getElementById("coding-tests");
        if (!quizData.hasTests) {
          codingTests.innerHTML = "<span class=\"italic-text\">" + quizData.tests + "</span>";
        } else {
          renderCodeList(codingTests, quizData.tests, "coding-test", "Test");
        }
        

        // display the solution(s)
        var codingSolutions = document.getElementById("coding-solutions");
        if (!quizData.hasSolutions) {
          codingSolutions.innerHTML = "<span class=\"italic-text\">" + quizData.solutions + "</span>";
        } else {
          renderCodeList(codingSolutions, quizData.solutions, "coding-solution", "Solution");
        }
      }
    </script>
  </body>
</html>
